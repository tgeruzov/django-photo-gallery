services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-gallery}
      POSTGRES_USER: ${DB_USER:-gallery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gallery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      # Только loopback: dev-compose на VPS не должен светить БД наружу (S12)
      - "127.0.0.1:5432:5432"

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    env_file: .env
    environment:
      DJANGO_ENV: dev
      DB_HOST: db
      ENABLE_BACKGROUND_TASKS: 1
      CELERY_TASK_ALWAYS_EAGER: 1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
