# Локальный запуск: docker compose up --build, затем http://localhost:8000
# Значения ниже можно переопределить в файле .env рядом (образец - .env.example)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gallery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    # Код и media/ смонтированы с хоста: root в разработке избавляет
    # от проблем с правами на запись. Образ для сервера работает от app.
    user: root
    # devserver - runserver, который сам применяет новые миграции после обновления кода
    command: >
      sh -c "python manage.py migrate --noinput &&
             (python manage.py createsuperuser --noinput 2>/dev/null || true) &&
             exec python manage.py devserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "1"
      DB_HOST: db
      DB_PASSWORD: ${DB_PASSWORD:-gallery}
      # Локальный администратор для раздела управления и /admin/, создаётся при первом запуске
      DJANGO_SUPERUSER_USERNAME: ${DJANGO_SUPERUSER_USERNAME:-admin}
      DJANGO_SUPERUSER_EMAIL: ${DJANGO_SUPERUSER_EMAIL:-admin@example.com}
      DJANGO_SUPERUSER_PASSWORD: ${DJANGO_SUPERUSER_PASSWORD:-admin}
    ports:
      - "${WEB_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
