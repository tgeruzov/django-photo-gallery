# Локальный запуск: docker compose up --build, затем http://localhost:8000
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gallery -d gallery"]
      interval: 2s
      timeout: 5s
      retries: 15

  web:
    build: .
    command: >
      sh -c "python manage.py migrate --noinput &&
             (python manage.py createsuperuser --noinput 2>/dev/null || true) &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
    environment:
      DEBUG: "1"
      DB_HOST: db
      # Локальный администратор для страницы загрузки и /admin/, создаётся при первом запуске
      DJANGO_SUPERUSER_USERNAME: admin
      DJANGO_SUPERUSER_EMAIL: admin@example.com
      DJANGO_SUPERUSER_PASSWORD: admin
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
