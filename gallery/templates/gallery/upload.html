{% extends "gallery/base.html" %}

{% block content %}
  <section class="upload">
    <h1 class="page-title">Загрузка</h1>

    <form method="post" enctype="multipart/form-data" id="upload-form" data-max-upload-mb="{{ max_upload_size_mb }}">
      {% csrf_token %}
      <label class="dropzone" for="id_files">
        {{ form.files }}
        <span class="dropzone-text">Выберите или перетащите файлы</span>
        <span class="dropzone-hint">JPEG, PNG, WebP. До {{ max_upload_size_mb }} МБ на файл</span>
      </label>
      <div class="previews" id="preview-container"></div>
      <button type="submit" id="submit-btn" class="button">Опубликовать</button>
    </form>

    <div id="upload-status" aria-live="polite" hidden></div>

    {% for message in messages %}
    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}

    {% if form.errors %}
    <div class="alert alert-error">
      {% for field, errors in form.errors.items %}{% for error in errors %}<p>{{ error }}</p>{% endfor %}{% endfor %}
    </div>
    {% endif %}
  </section>
{% endblock %}
