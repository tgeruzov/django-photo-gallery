x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  db:
    image: postgres:16-alpine
    logging: *default-logging
    environment:
      POSTGRES_DB: ${DB_NAME:-gallery}
      POSTGRES_USER: ${DB_USER:-gallery}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-gallery}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  db-backup:
    image: postgres:16-alpine
    entrypoint: /bin/sh
    command: >-
      -c 'while true; do
      pg_dump -h db -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -F c
      -f "/backups/gallery-$$(date +%Y%m%d-%H%M%S).dump"
      && find /backups -name "*.dump" -mtime +14 -delete;
      sleep 86400; done'
    environment:
      POSTGRES_DB: ${DB_NAME:-gallery}
      POSTGRES_USER: ${DB_USER:-gallery}
      PGPASSWORD: ${DB_PASSWORD:-gallery}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  redis:
    image: redis:7-alpine
    logging: *default-logging
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    env_file: .env
    volumes:
      - static_data:/app/staticfiles
      - media_data:/app/media
    environment:
      DJANGO_ENV: prod
      DEBUG: 0
      DB_HOST: db
      ENABLE_BACKGROUND_TASKS: 1
      CELERY_TASK_ALWAYS_EAGER: 0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
      SECURE_SSL_REDIRECT: 0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    restart: unless-stopped
    logging: *default-logging

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_data:/srv/static:ro
      - media_data:/srv/media:ro
    ports:
      - "80:80"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
    logging: *default-logging

  worker:
    build: .
    # -B: встроенный beat для периодического backfill (достаточно,
    # пока воркер один; при масштабировании вынести beat отдельно)
    command: celery -A config worker --loglevel=info -B
    env_file: .env
    volumes:
      - media_data:/app/media
    environment:
      DJANGO_ENV: prod
      DEBUG: 0
      DB_HOST: db
      ENABLE_BACKGROUND_TASKS: 1
      CELERY_TASK_ALWAYS_EAGER: 0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    logging: *default-logging

volumes:
  postgres_data:
  redis_data:
  static_data:
  media_data:
