[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "S", "C4", "SIM"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"config/settings/__init__.py" = ["F401", "F403"]
"config/settings/dev.py" = ["F403", "F405"]
"config/settings/prod.py" = ["F403", "F405"]
"config/settings/test.py" = ["F403", "F405"]
"gallery/tests.py" = ["S101", "S106"]
