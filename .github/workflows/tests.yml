name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый push в ту же ветку отменяет устаревший прогон
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: node --check static/js/script.js && node --check static/js/manage.js
      - name: Known vulnerabilities in dependencies
        run: pip-audit -r requirements.txt

  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gallery
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallery -d gallery"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    env:
      DEBUG: "1"
      DB_HOST: localhost
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - name: Production settings pass the deploy checklist
        env:
          DEBUG: "0"
          ALLOWED_HOSTS: photo.example.com
        run: |
          SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            python manage.py check --deploy --fail-level WARNING
      - run: coverage run manage.py test
      - run: coverage report

  docker:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gallery
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gallery -d gallery"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 15
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t django-photo-gallery .
      - name: The image migrates, serves pages and stops gracefully
        run: |
          docker run -d --name web --network host \
            -e DEBUG=0 \
            -e SECRET_KEY="$(python3 -c 'import secrets; print(secrets.token_urlsafe(50))')" \
            -e ALLOWED_HOSTS=localhost \
            -e DB_HOST=localhost \
            -e SECURE_SSL_REDIRECT=0 \
            django-photo-gallery
          for attempt in $(seq 1 30); do
            curl -fsS http://localhost:8000/healthz && break
            sleep 1
          done
          curl -fsS http://localhost:8000/healthz
          curl -fsS -o /dev/null http://localhost:8000/
          test "$(docker exec web id -u)" = "1000"
          # Gunicorn получает SIGTERM сам и выходит сразу, а не по SIGKILL через 10 секунд
          started=$(date +%s)
          docker stop web
          test $(( $(date +%s) - started )) -lt 8
      - if: always()
        run: docker logs web || true
