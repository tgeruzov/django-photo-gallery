name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gallery
          POSTGRES_USER: gallery
          POSTGRES_PASSWORD: gallery
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U gallery -d gallery"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DJANGO_ENV: "test"
      DEBUG: "1"
      SECRET_KEY: "ci-secret-key"
      ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      DB_NAME: "gallery"
      DB_USER: "gallery"
      DB_PASSWORD: "gallery"
      DB_HOST: "127.0.0.1"
      DB_PORT: "5432"
      CELERY_TASK_ALWAYS_EAGER: "1"
      ENABLE_BACKGROUND_TASKS: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run lint and formatting checks
        run: pre-commit run --all-files --show-diff-on-failure

      - name: Audit dependencies
        run: pipx run pip-audit -r requirements.txt

      - name: Check production configuration
        env:
          DJANGO_ENV: "prod"
          DEBUG: "0"
          # Полностью «зелёная» prod-конфигурация для --fail-level WARNING
          SECURE_HSTS_SECONDS: "31536000"
          SECURE_HSTS_PRELOAD: "1"
        run: |
          SECRET_KEY=$(openssl rand -hex 32) python manage.py check --deploy --fail-level WARNING

      - name: Run migrations
        run: python manage.py migrate

      - name: Run tests with coverage
        run: |
          coverage run manage.py test
          coverage report --fail-under=75
