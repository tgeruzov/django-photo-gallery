server {
    listen 80;
    server_name _;

    # Должен быть не меньше MAX_UPLOAD_SIZE_MB, иначе nginx отклонит
    # загрузку раньше, чем её увидит Django.
    client_max_body_size 100m;

    location /static/ {
        alias /srv/static/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Согласовано с gunicorn --timeout 120
        proxy_read_timeout 120s;
    }
}
